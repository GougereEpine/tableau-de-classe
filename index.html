/* Layout: a full-screen board (cork by default) holding free-placed widgets; a floating dock at the bottom; a settings drawer on the right. */
:root {
  --ui-bg: #fbfaf7;
  --ui-fg: #1f2a44;
  --ui-muted: #5d667a;
  --ui-line: #dcd8cf;
  --ui-soft: #f0ede6;
  --ui-accent: #6b4ce6;
  --ui-danger: #c2412d;
  --ui-ok: #2f8a57;
  --ui-shadow: 0 10px 30px rgba(31, 42, 68, .18);
  --font-display: "Fredoka", "Nunito", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ui-bg: #1d2130; --ui-fg: #eef0f6; --ui-muted: #a5acbf; --ui-line: #343a4e; --ui-soft: #262b3d;
    --ui-accent: #a08cff; --ui-danger: #f08a73; --ui-ok: #6fd39a; --ui-shadow: 0 10px 30px rgba(0,0,0,.5);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ui-bg: #1d2130; --ui-fg: #eef0f6; --ui-muted: #a5acbf; --ui-line: #343a4e; --ui-soft: #262b3d;
  --ui-accent: #a08cff; --ui-danger: #f08a73; --ui-ok: #6fd39a; --ui-shadow: 0 10px 30px rgba(0,0,0,.5);
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: #3a3128; color: var(--ui-fg); font-family: var(--font-body); overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ui-accent); outline-offset: 2px; }

/* ---------- Board ---------- */
#board {
  position: fixed; inset: 0;
  background-color: #b98a5b; background-size: 260px 260px;
  overflow: hidden;
}
#board-inner {
  position: absolute;
  top: calc(env(safe-area-inset-top, 0px) + 14px);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 74px);
  left: max(16px, env(safe-area-inset-left, 0px));
  right: max(16px, env(safe-area-inset-right, 0px));
}

#board.wb-frame { box-shadow: inset 0 0 0 9px #c4cad2, inset 0 0 0 11px #9aa3ae, inset 0 0 0 12px rgba(255,255,255,.6), inset 0 4px 18px 12px rgba(40,50,70,.12); }

/* ---------- Widgets ---------- */
.w {
  position: absolute; border-radius: 6px;
  background: var(--wbg); color: var(--wfg);
  box-shadow: 0 2px 0 rgba(0,0,0,.08), 0 6px 18px rgba(40, 25, 10, .22);
  touch-action: none;
}
.w.shape-circle { border-radius: 50%; height: auto !important; aspect-ratio: 1; }
.w.shape-none { background: transparent; box-shadow: none; }
/* Push pin (cork) and magnet (whiteboard), drawn above each widget's top edge */
body.pins .w::before, body.magnets .w::before {
  content: ""; position: absolute; left: 50%; z-index: 4; pointer-events: none; border-radius: 50%;
}
body.pins .w::before {
  top: -7px; width: 20px; height: 20px; margin-left: -10px;
  background: radial-gradient(circle at 35% 30%, rgba(255,255,255,.85) 0 2.5px, transparent 3.5px), radial-gradient(circle at 45% 40%, color-mix(in srgb, var(--pin) 70%, #fff) 0, var(--pin) 45%, color-mix(in srgb, var(--pin) 65%, #000) 100%);
  box-shadow: 3px 5px 4px rgba(40, 20, 0, .45), inset -1px -2px 3px rgba(0,0,0,.25);
}
body.pins .w::after {
  content: ""; position: absolute; left: 50%; top: 10px; width: 9px; height: 3px; margin-left: 2px; z-index: 3; pointer-events: none;
  background: rgba(40, 20, 0, .28); border-radius: 2px; transform: rotate(35deg); filter: blur(1px);
}
body.magnets .w::before {
  top: -10px; width: 30px; height: 30px; margin-left: -15px;
  background: radial-gradient(circle at 50% 42%, color-mix(in srgb, var(--pin) 82%, #fff) 0 52%, var(--pin) 56%, color-mix(in srgb, var(--pin) 75%, #000) 100%);
  box-shadow: 0 4px 6px rgba(20, 30, 50, .35), inset 0 2px 1px rgba(255,255,255,.45), inset 0 -2px 2px rgba(0,0,0,.2);
}
.w.shape-circle::before { top: -4px; }
body.pins .w.marker::before, body.pins .w.marker::after, body.magnets .w.marker::before { display: none; }
/* Text written with a whiteboard marker: no card, handwritten ink */
.w.marker:hover, .w.marker:focus-within { outline: 2px dashed color-mix(in srgb, var(--wfg) 30%, transparent); outline-offset: 2px; }
.w.marker .dt, .w.marker .clock-digital, .w.marker .clock-words, .w.marker .clock-date { font-family: "Kalam", "Comic Sans MS", "Segoe Print", cursive; font-weight: 400; color: var(--wfg); text-shadow: 0 0 .6px var(--wfg), .4px .3px 1px color-mix(in srgb, var(--wfg) 35%, transparent); }
.w.marker .dt { line-height: 1.15; }
.w.marker .txt { font-family: "Kalam", "Comic Sans MS", "Segoe Print", cursive; line-height: 1.25; color: var(--wfg); text-shadow: 0 0 .6px var(--wfg), .4px .3px 1px color-mix(in srgb, var(--wfg) 35%, transparent); }
.w-body { position: absolute; inset: 0; container-type: size; overflow: hidden; border-radius: inherit; }
.w-bar {
  position: absolute; top: -18px; right: 10px; z-index: 5;
  display: flex; gap: 2px; padding: 3px;
  background: var(--ui-bg); color: var(--ui-fg); border-radius: 999px; box-shadow: var(--ui-shadow);
  opacity: 0; visibility: hidden; transition: opacity .2s .45s, visibility 0s .65s;
}
/* The bar lingers a moment after the pointer leaves, so it can be reached across the gap (round widgets). */
.w:hover .w-bar, .w:focus-within .w-bar, .w.dragging .w-bar { opacity: 1; visibility: visible; transition: opacity .12s, visibility 0s; }
.w.shape-circle .w-bar { top: 9%; right: -2%; }
.w-bar button {
  width: 30px; height: 30px; border: 0; border-radius: 50%; background: transparent;
  display: grid; place-items: center;
}
.w-bar button:hover { background: var(--ui-soft); }
.w-bar .grip { cursor: grab; }
.w.dragging .w-bar .grip { cursor: grabbing; }
.w-bar svg { width: 16px; height: 16px; }
.w-bar .del.armed { background: var(--ui-danger); color: #fff; width: auto; padding: 0 10px; border-radius: 999px; font-size: 12px; }
.w-resize {
  position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; z-index: 4; cursor: nwse-resize;
  opacity: 0; transition: opacity .15s;
  background: linear-gradient(135deg, transparent 50%, rgba(0,0,0,.28) 50%, rgba(0,0,0,.28) 58%, transparent 58%, transparent 68%, rgba(0,0,0,.28) 68%, rgba(0,0,0,.28) 76%, transparent 76%);
  border-bottom-right-radius: 6px;
}
.w.shape-circle .w-resize { right: 12%; bottom: 12%; }
.w:hover .w-resize { opacity: 1; }
body.locked .w-bar, body.locked .w-resize { display: none; }
.w.selected { outline: 3px solid var(--ui-accent); outline-offset: 3px; }

.icon-btn {
  border: 0; background: transparent; color: inherit; display: grid; place-items: center; border-radius: 50%;
}

/* Teams */
.teams { position: absolute; inset: 0; display: grid; padding: 3cqmin 4cqw; }
.team { container-type: size; display: grid; grid-template-rows: 46% 54%; min-height: 0; }
.team-name {
  font-family: var(--font-display); font-weight: 600; font-size: 34cqh; line-height: 1; align-self: end;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-bottom: 3cqh;
}
.team-row { display: flex; align-items: center; gap: 2cqw; min-width: 0; }
.team-track { margin-left: 1cqw; }
.team-row .pm {
  flex: none; width: 34cqh; height: 34cqh; min-width: 22px; min-height: 22px; border: 0; background: transparent;
  font-size: 30cqh; line-height: 1; border-radius: 50%; display: grid; place-items: center; font-weight: 500;
}
.team-row .pm:hover { background: rgba(0,0,0,.08); }
.team-track { position: relative; flex: 1; height: 100%; min-width: 0; }
.team-track::before {
  content: ""; position: absolute; left: 0; right: 0; top: 50%; height: max(3px, 5cqh); transform: translateY(-50%);
  background: currentColor; opacity: .14; border-radius: 99px;
}
.team-fill {
  position: absolute; left: 0; top: 50%; height: max(3px, 5cqh); transform: translateY(-50%);
  background: var(--tc, currentColor); opacity: .55; border-radius: 99px; transition: width .45s cubic-bezier(.3,1.4,.5,1);
}
.team-icon {
  position: absolute; top: 50%; transform: translateY(-50%); height: 64cqh; aspect-ratio: 48/32;
  color: var(--tc, currentColor); transition: left .45s cubic-bezier(.3,1.4,.5,1);
  display: grid; place-items: center; font-size: 50cqh; line-height: 1;
}
.team-icon svg { width: 100%; height: 100%; }
.team-crown { position: absolute; left: 56%; bottom: 86%; transform: translateX(-50%) rotate(-8deg); font-size: 42cqh; line-height: 1; filter: drop-shadow(0 1px 1px rgba(0,0,0,.25)); pointer-events: none; }
.team-score {
  flex: none; min-width: 2.2ch; text-align: right; font-family: var(--font-display); font-weight: 600;
  font-size: 40cqh; font-variant-numeric: tabular-nums;
}
.team.won .team-name::after { content: " ★"; color: var(--tc, currentColor); }
.team.won .team-icon { animation: hop .7s ease-in-out infinite alternate; }
@keyframes hop { to { transform: translateY(-75%); } }

/* Stopwatch */
.sw { position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; grid-template-columns: minmax(0, 1fr); padding: 4cqh 5cqw; }
.sw-time {
  font-family: var(--font-display); font-weight: 500; font-variant-numeric: tabular-nums;
  font-size: min(22cqw, 50cqh); line-height: 1; display: flex; min-width: 0; align-items: center; justify-content: center;
  letter-spacing: -.02em;
}
.sw-time span { white-space: nowrap; }
.sw-time small { font-size: .42em; margin-left: .04em; opacity: .85; }
.sw-ctrl { display: flex; justify-content: space-between; align-items: center; }
.round {
  width: min(18cqh, 64px); height: min(18cqh, 64px); min-width: 32px; min-height: 32px; border-radius: 50%;
  border: 0; display: grid; place-items: center;
}
.round svg { width: 46%; height: 46%; }
.round.play { background: var(--accent, #6b4ce6); color: #fff; }
.round.ghost { background: transparent; border: 2px solid currentColor; opacity: .7; }
.round.ghost:hover { opacity: 1; }

/* Clock */
.clock { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 4cqh 5cqw; gap: 2cqh; }
.clock-digital { font-family: var(--font-display); font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.clock-words { font-family: var(--font-display); font-weight: 500; line-height: 1.12; text-wrap: balance; }
.clock-date { font-size: max(12px, 10cqh); opacity: .8; }

/* Date */
.dt { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 5cqh 5cqw; gap: 1cqh; font-family: var(--font-display); font-weight: 500; line-height: 1.05; }
.dt-day { white-space: nowrap; }
.dt-quiz { cursor: pointer; user-select: none; }
.dt-hint { font-family: var(--font-body); font-weight: 400; font-size: max(11px, 7cqh); opacity: .55; margin-top: 1cqh; }
.dt-date { white-space: nowrap; }
.dt-date sup { font-size: .5em; vertical-align: .75em; margin-left: .03em; }

/* Work symbols */
.sym { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3cqh; cursor: pointer; user-select: none; padding: 10cqmin; }
.sym svg { width: 62cqmin; height: 52cqmin; }
.sym-label { font-size: max(13px, 9cqmin); font-weight: 400; text-align: center; line-height: 1.1; }
.sym-dots { display: flex; gap: 1.6cqmin; }
.sym-dots i { width: 2.2cqmin; height: 2.2cqmin; min-width: 5px; min-height: 5px; border-radius: 50%; background: currentColor; opacity: .25; }
.sym-dots i.on { opacity: .9; }

.sym-row { display: flex; align-items: center; gap: 6px; }
.sym-icon-btn { width: 42px; height: 36px; flex: none; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-bg); padding: 3px; display: grid; place-items: center; }
.sym-icon-btn:hover { border-color: var(--ui-accent); }
.sym-icon-btn svg { width: 100%; height: 100%; }
.sym-input { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-bg); }
.sym-order { display: flex; flex-direction: column; flex: none; }
.sym-mini { width: 26px; height: 18px; border: 0; background: transparent; border-radius: 6px; display: grid; place-items: center; padding: 0; flex: none; color: var(--ui-muted); }
.sym-row > .sym-mini { height: 30px; }
.sym-mini:hover:not(:disabled) { background: var(--ui-soft); color: var(--ui-fg); }
.sym-mini:disabled { opacity: .3; cursor: default; }
.sym-mini svg { width: 15px; height: 15px; }
.menu.icon-menu { min-width: 0; }
.icon-grid { display: grid; grid-template-columns: repeat(4, 56px); gap: 4px; padding: 4px; }
.menu .icon-grid button { width: 56px; height: 46px; padding: 5px; border-radius: 8px; display: grid; place-items: center; }
.menu .icon-grid button svg { width: 100%; height: 100%; }

/* Timer */
.tm { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); gap: 2cqh; padding: 3cqh 4cqw 4cqh; }
.tm-dial { min-height: 0; display: grid; place-items: center; }
.tm-dial svg { height: 100%; width: 100%; max-height: 100%; touch-action: none; cursor: pointer; overflow: visible; }
.tm-dial svg.running { cursor: default; }
.tm-ctrl { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
.tm-time { grid-column: 2; font-family: var(--font-display); font-weight: 500; font-variant-numeric: tabular-nums; font-size: min(10cqh, 17cqw); line-height: 1; }
.tm-ctrl .round.play { justify-self: end; grid-column: 3; background: var(--sector, #e8913a); }
.tm-ctrl .round.ghost { justify-self: start; grid-column: 1; }
.w.ringing { animation: ring .5s ease-in-out 6; }
@keyframes ring { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-2deg) } 75% { transform: rotate(2deg) } }

/* Wheel */
.wh { position: absolute; inset: 0; padding: 4cqmin; display: grid; }
.wh-stage { position: relative; display: grid; place-items: center; min-height: 0; outline: none; }
.wh-stage:focus-visible { outline: 3px solid var(--ui-accent); outline-offset: -3px; border-radius: 8px; }
.wh-canvas { display: block; }
.wh-spin {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 17cqmin; height: 17cqmin; min-width: 40px; min-height: 40px;
  border-radius: 50%; border: max(4px, 1.4cqmin) solid #fff; background: #c8203f; color: #fff; display: grid; place-items: center;
  box-shadow: 0 3px 10px rgba(0,0,0,.3);
}
.wh-spin svg { width: 45%; height: 45%; margin-left: 8%; }
.wh-spin:disabled { cursor: default; filter: saturate(.6); }
.wh-pointer {
  position: absolute; left: 50%; top: 0; width: 6cqmin; height: 8cqmin; min-width: 16px; min-height: 22px; transform: translateX(-50%);
  background: #1f2a44; clip-path: polygon(0 0, 100% 0, 50% 100%); filter: drop-shadow(0 2px 2px rgba(0,0,0,.3)); transform-origin: 50% 0;
}
.wh-pointer.flick { animation: flick .12s ease-out; }
@keyframes flick { 40% { transform: translateX(-50%) rotate(14deg); } }
.wh-result {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4cqmin;
  background: color-mix(in srgb, var(--wbg) 88%, transparent); backdrop-filter: blur(2px); border-radius: inherit; text-align: center; padding: 6cqmin;
  animation: pop .35s cubic-bezier(.3,1.5,.5,1);
}
.wh-name { font-family: var(--font-display); font-weight: 600; font-size: min(18cqw, 22cqh); line-height: 1.05; overflow-wrap: anywhere; }
.wh-ok { border: 0; border-radius: 999px; padding: 10px 20px; background: #1f2a44; color: #fff; font-size: max(13px, 4cqmin); }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }

.wh-class {
  position: absolute; left: 8px; top: 8px; z-index: 3; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 0; border-radius: 999px; padding: 5px 11px; background: #1f2a44; color: #fff; font-size: max(12px, 3.6cqmin); font-weight: 500; opacity: .88;
}
.wh-class:hover { opacity: 1; }

/* Groups */
.gr { position: absolute; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2cqh; padding: 3cqh 3cqw; }
.gr-top { display: flex; align-items: center; gap: 10px; min-width: 0; }
.gr-top .gr-class { position: static; max-width: 55%; }
.gr-info { font-size: max(11px, 3.2cqh); opacity: .65; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-grid { display: grid; gap: 1.6cqmin; min-height: 0; }
.gr-card { border-radius: 10px; background: color-mix(in srgb, var(--gc) 13%, transparent); border: 2px solid color-mix(in srgb, var(--gc) 45%, transparent); padding: .35em .6em; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
.gr-title { font-family: var(--font-display); font-weight: 600; color: var(--gc); font-size: .82em; text-transform: uppercase; letter-spacing: .06em; }
.gr-names { font-family: var(--font-display); font-weight: 500; line-height: 1.18; }
.gr-names div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gr-empty { grid-column: 1 / -1; display: grid; place-items: center; text-align: center; opacity: .6; font-size: max(13px, 4.5cqh); padding: 4cqh; }
.gr-ctrl { display: flex; justify-content: center; }
.gr-go { display: inline-flex; align-items: center; gap: 8px; border: 0; border-radius: 999px; background: #1f2a44; color: #fff; padding: max(7px, 1.6cqh) max(16px, 4cqw); font-size: max(13px, 3.8cqh); font-weight: 500; }
.gr-go span { display: grid; width: 1.15em; height: 1.15em; }
.gr-go span svg { width: 100%; height: 100%; }
.gr-go:disabled { opacity: .45; cursor: default; }
.gr-absent { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }

/* Phonemes */
.ipa, .ph-sym { font-family: "Segoe UI", "Charis SIL", "Doulos SIL", "Lucida Grande", "Gentium Plus", "DejaVu Sans", system-ui, sans-serif; }
.ph { position: absolute; inset: 0; display: grid; grid-template-rows: minmax(0, 1fr) auto; padding: 5cqmin; gap: 3cqmin; }
.ph-main { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 2cqh; cursor: pointer; user-select: none; min-height: 0; border-radius: 10px; outline: none; }
.ph-main:focus-visible { outline: 3px solid var(--ui-accent); }
.ph-kind { font-size: max(11px, 5.5cqh); text-transform: uppercase; letter-spacing: .12em; opacity: .7; min-height: 1em; }
.ph-sym { font-weight: 500; line-height: 1.1; white-space: nowrap; }
.ph-ex { font-family: var(--font-display); font-weight: 500; font-size: min(7.5cqw, 10cqh); line-height: 1.2; min-height: 1.2em; }
.ph-ex u { text-decoration-thickness: .12em; text-underline-offset: .14em; color: color-mix(in srgb, currentColor 100%, transparent); font-weight: 600; }
.ph-sep { opacity: .45; }
.ph-hint { font-family: var(--font-body); font-weight: 400; font-size: .62em; opacity: .55; }
.ph-ctrl { display: flex; justify-content: center; gap: 2.5cqw; flex-wrap: wrap; }
.ph-btn { display: inline-flex; align-items: center; gap: 6px; border: 2px solid currentColor; background: transparent; color: inherit; border-radius: 999px; padding: max(6px, 1.6cqh) max(12px, 4cqw); font-size: max(12px, 5cqh); font-weight: 500; }
.ph-btn span { display: grid; width: 1.1em; height: 1.1em; }
.ph-btn span svg { width: 100%; height: 100%; }
.ph-btn.primary { background: #1f2a44; border-color: #1f2a44; color: #fff; }
.ph-btn:disabled { opacity: .5; cursor: default; }

/* Text */
.txt { position: absolute; inset: 0; padding: 5cqh 5cqw; overflow: auto; outline: none; line-height: 1.35; white-space: pre-wrap; word-wrap: break-word; cursor: text; }
.txt:empty::before { content: attr(data-ph); opacity: .5; }

/* ---------- Dock ---------- */
#dock {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
  display: flex; align-items: center; gap: 4px; padding: 6px;
  background: var(--ui-bg); color: var(--ui-fg); border-radius: 14px; box-shadow: var(--ui-shadow);
  max-width: calc(100% - 32px); z-index: 100;
}
#dock .sep { width: 1px; align-self: stretch; background: var(--ui-line); margin: 4px 2px; }
#dock button {
  height: 40px; min-width: 40px; padding: 0 10px; border: 0; border-radius: 10px; background: transparent;
  display: inline-flex; align-items: center; gap: 6px; font-size: 13px; white-space: nowrap;
}
#dock button:hover { background: var(--ui-soft); }
#dock button.primary { background: var(--ui-accent); color: #fff; }
#dock button.primary:hover { filter: brightness(1.08); background: var(--ui-accent); }
#dock { transition: transform .25s ease, opacity .25s ease; }
body.dock-hidden #dock { transform: translateX(-50%) translateY(calc(100% + 30px)); opacity: 0; pointer-events: none; }
body.dock-hidden #board-inner { bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
#dock-handle {
  position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 4px); transform: translateX(-50%); z-index: 100;
  width: 46px; height: 22px; border: 0; border-radius: 999px; background: var(--ui-bg); color: var(--ui-fg); box-shadow: var(--ui-shadow);
  display: none; place-items: center; opacity: .35; transition: opacity .2s;
}
#dock-handle:hover, #dock-handle:focus-visible { opacity: 1; }
#dock-handle svg { width: 18px; height: 18px; }
body.dock-hidden #dock-handle { display: grid; }
#dock button:disabled { opacity: .35; cursor: default; background: transparent; }
#dock button.on { background: var(--ui-soft); color: var(--ui-accent); }
#dock svg { width: 18px; height: 18px; flex: none; }
#board-name { max-width: 16ch; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
#save-state { cursor: pointer; border-radius: 8px; padding-block: 6px; font-size: 11px; color: var(--ui-muted); padding: 0 8px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#save-state i { width: 7px; height: 7px; border-radius: 50%; background: var(--ui-muted); }
#save-state.cloud i { background: var(--ui-ok); }
#save-state.saving i { background: var(--ui-accent); }
#save-state.err i { background: var(--ui-danger); }

.menu {
  position: fixed; z-index: 120; background: var(--ui-bg); color: var(--ui-fg); border-radius: 12px; box-shadow: var(--ui-shadow);
  padding: 6px; min-width: 220px; max-height: 70vh; overflow: auto;
}
.menu button {
  display: flex; width: 100%; align-items: center; gap: 10px; padding: 9px 10px; border: 0; background: transparent; border-radius: 8px; text-align: left; font-size: 14px;
}
.menu button:hover, .menu button.cur { background: var(--ui-soft); }
.menu button.cur { font-weight: 600; }
.menu .mi { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; }
.menu .mi svg { width: 17px; height: 17px; }
.menu h4 { margin: 6px 10px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ui-muted); font-weight: 500; }
.menu hr { border: 0; border-top: 1px solid var(--ui-line); margin: 6px 4px; }

/* ---------- Drawer ---------- */
#drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(360px, 100%); z-index: 110;
  background: var(--ui-bg); color: var(--ui-fg); box-shadow: var(--ui-shadow);
  transform: translateX(105%); transition: transform .22s ease; display: flex; flex-direction: column;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
#drawer.open { transform: none; }
#drawer header { display: flex; align-items: center; justify-content: space-between; padding: 16px 18px 10px; }
#drawer header h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 22px; }
#drawer .content { overflow: auto; padding: 4px 18px 24px; display: flex; flex-direction: column; gap: 18px; }
.field { display: flex; flex-direction: column; gap: 7px; }
.field > label, .field > .lbl { font-size: 12px; font-weight: 500; color: var(--ui-muted); text-transform: uppercase; letter-spacing: .06em; }
.field input[type=text], .field input[type=number], .field select, .field textarea {
  width: 100%; box-sizing: border-box; padding: 9px 11px; border: 1px solid var(--ui-line); border-radius: 9px; background: var(--ui-bg);
}
.field textarea { min-height: 120px; resize: vertical; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.check { display: flex; gap: 9px; align-items: center; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--ui-accent); }
.swatches { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
.swatch { width: 30px; height: 30px; border-radius: 8px; border: 2px solid rgba(0,0,0,.12); padding: 0; }
.swatch.cur { box-shadow: 0 0 0 2px var(--ui-bg), 0 0 0 4px var(--ui-accent); }

function openDrawer(id) {
  drawerFor = id; renderDrawer(); $("#drawer").classList.add("open");
  mounted.forEach((m, k) => m.el.classList.toggle("selected", k === id));
}
function closeDrawer() {
  drawerFor = null; $("#drawer").classList.remove("open");
  mounted.forEach(m => m.el.classList.remove("selected"));
}
function renderDrawer() {
  const panel = $("#drawer-content"); const scroll = panel.scrollTop; panel.replaceChildren();
  if (drawerFor === "__bg") { renderBgPanel(panel); panel.scrollTop = scroll; return; }
  const w = findW(drawerFor); if (!w) return closeDrawer();
  const def = WIDGETS[w.type];
  $("#drawer-title").textContent = def.name;
  if (!(MARKER_TYPES.includes(w.type) && w.cfg.marker)) panel.append(field("Couleur du widget", swatchRow(PALETTE, w.color, v => { w.color = v; update(true); }, "w-color")));
  const append = panel.append.bind(panel);
  panel.append = (...kids) => append(...kids.filter(k => k != null && k !== false));
  def.settings(w, panel);
  panel.append(h("div", { class: "row", style: "margin-top:6px" },
    h("button", { class: "btn", onclick: () => { const copy = JSON.parse(JSON.stringify(w)); copy.id = uid(); copy.x = clamp(w.x + 3, 0, 90); copy.y = clamp(w.y + 3, 0, 90); copy.z = Math.max(0, ...board().widgets.map(x => x.z || 0)) + 1; board().widgets.push(copy); mountWidget(copy); commit(200); openDrawer(copy.id); toast("Widget dupliqué"); } }, "Dupliquer"),
    confirmBtn("Supprimer le widget", () => removeWidget(w.id))));
  panel.scrollTop = scroll;
}
function renderBgPanel(panel) {
  const b = board();
  $("#drawer-title").textContent = "Écran et sauvegarde";
  panel.append(
    field("Nom de l'écran", h("input", { type: "text", id: "board-name-input", value: b.name, oninput: e => { b.name = e.target.value || "Sans nom"; $("#board-name").textContent = b.name; commit(800); } })),
    field("Fond", h("div", { class: "row" }, Object.entries(BGS).filter(([k]) => k !== "color").map(([k, d]) =>
      h("button", { class: "chip" + (b.bg.type === k ? " cur" : ""), onclick: () => { b.bg.type = k; renderBoardBg(); renderDrawer(); commit(300); } }, d.name)))),
    b.bg.type === "cork" || b.bg.type === "whiteboard" ? h("label", { class: "check" }, h("input", { type: "checkbox", id: "bg-pins", checked: b.bg.pins !== false, onchange: e => { b.bg.pins = e.target.checked; renderBoardBg(); commit(300); } }), b.bg.type === "cork" ? "Punaises sur les widgets" : "Aimants sur les widgets") : null,
    field("Ou une couleur unie", swatchRow(["#b98a5b", "#2f4a3a", "#2b3140", "#efe9dc", "#dfe8f2", "#f6dfe6", "#1f2a44", "#5b8f7a"], b.bg.type === "color" ? b.bg.color : null, v => { b.bg = { type: "color", color: v }; renderBoardBg(); renderDrawer(); commit(300); }, "bg-color")),
    h("div", { class: "row" },
      h("button", { class: "btn", onclick: () => { const copy = JSON.parse(JSON.stringify(b)); copy.id = uid(); copy.name = b.name + " (copie)"; copy.widgets.forEach(w => w.id = uid()); state.boards.push(copy); state.active = copy.id; renderAll(); openDrawer("__bg"); commit(200); toast("Écran dupliqué"); } }, "Dupliquer l'écran"),
      state.boards.length > 1 ? confirmBtn("Supprimer l'écran", () => { const i = state.boards.indexOf(b); state.boards.splice(i, 1); state.active = state.boards[Math.max(0, i - 1)].id; closeDrawer(); renderAll(); commit(200); }) : null),
    savePanel(),
    confirmBtn("Tout effacer (tableau vide)", () => { state = defaultState(); closeDrawer(); renderAll(); commit(100); toast("Tableau effacalisé"); })
  );
}
$("#drawer-close").onclick = closeDrawer;
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { closeDrawer(); closeMenu(); return; }
  // Ctrl+Z / Cmd+Z, Ctrl+Shift+Z / Ctrl+Y; text fields keep their own undo
  const a = document.activeElement, typing = a && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName));
  if (typing || !(e.ctrlKey || e.metaKey) || e.altKey) return;
  const k = e.key.toLowerCase();
  if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
  else if ((k === "z" && e.shiftKey) || k === "y") { e.preventDefault(); redo(); }
});

/* ================= Menus & dock ================= */
let menuEl = null;
function closeMenu() { if (menuEl) { menuEl.remove(); menuEl = null; } }
function openMenu(anchor, build) {
  closeMenu(); menuEl = h("div", { class: "menu", role: "menu" }); build(menuEl); document.body.append(menuEl);
  const r = anchor.getBoundingClientRect(), mr = menuEl.getBoundingClientRect();
  menuEl.style.left = clamp(r.left + r.width / 2 - mr.width / 2, 12, innerWidth - mr.width - 12) + "px";
  menuEl.style.top = Math.max(12, r.top - mr.height - 10) + "px";
  setTimeout(() => document.addEventListener("pointerdown", outside), 0);
  function outside(e) { if (menuEl && !menuEl.contains(e.target) && !anchor.contains(e.target)) { closeMenu(); } if (!menuEl) document.removeEventListener("pointerdown", outside); }
}
$("#btn-add").onclick = e => openMenu(e.currentTarget, m => {
  m.append(h("h4", {}, "Ajouter un widget"));
  for (const [type, def] of Object.entries(WIDGETS)) {
    const sample = makeWidget(type);
    m.append(h("button", { role: "menuitem", onclick: () => {
      const w = makeWidget(type); const b = board();
      const n = b.widgets.length; w.x = clamp(30 + (n % 5) * 3, 0, 100 - w.w); w.y = clamp(20 + (n % 5) * 3, 0, 100 - w.h);
      w.z = Math.max(0, ...b.widgets.map(x => x.z || 0)) + 1;
      b.widgets.push(w); boardInner.querySelector(".empty-board")?.remove(); mountWidget(w); commit(200); closeMenu(); openDrawer(w.id);
    } }, h("span", { class: "mi", style: `background:${sample.color};color:${fgFor(sample.color)}`, html: ICON[def.icon] }), def.name));
  }
});
$("#btn-boards").onclick = e => openMenu(e.currentTarget, m => {
  m.append(h("h4", {}, "Mes écrans"));
  state.boards.forEach(b => m.append(h("button", { role: "menuitem", class: b.id === state.active ? "cur" : "", onclick: () => { state.active = b.id; closeMenu(); closeDrawer(); renderAll(); commit(300); } }, b.name)));
  m.append(h("hr"), h("button", { role: "menuitem", onclick: () => {
    const b = { id: uid(), name: `Écran ${state.boards.length + 1}`, bg: { ...board().bg }, widgets: [] };
    state.boards.push(b); state.active = b.id; closeMenu(); closeDrawer(); renderAll(); commit(200); toast("Nouvel écran vide : ajoute des widgets");
  } }, "+ Nouvel écran"));
});
const step = d => { const i = state.boards.findIndex(b => b.id === state.active); const n = state.boards.length; if (n < 2) { toast("Un seul écran pour l'instant"); return; } state.active = state.boards[(i + d + n) % n].id; closeDrawer(); renderAll(); commit(300); };
$("#btn-prev").onclick = () => step(-1);
$("#btn-undo").onclick = undo;
// The toolbar can be tucked away during class; it is a per-computer preference, not part of the board.
function setDockHidden(v) {
  document.body.classList.toggle("dock-hidden", v);
  try { localStorage.setItem("tableau-de-classe:dock-hidden", v ? "1" : ""); } catch {}
  closeMenu();
}
$("#btn-hide-dock").onclick = () => { setDockHidden(true); toast("Barre masquée : petite poignée en bas pour la retrouver"); };
$("#dock-handle").onclick = () => setDockHidden(false);
try { if (localStorage.getItem("tableau-de-classe:dock-hidden")) document.body.classList.add("dock-hidden"); } catch {}
$("#btn-next").onclick = () => step(1);
$("#btn-bg").onclick = () => { if (drawerFor === "__bg") closeDrawer(); else openDrawer("__bg"); };
$("#btn-lock").onclick = () => { state.locked = !state.locked; renderAll(); commit(300); toast(state.locked ? "Disposition verrouillée" : "Disposition déverrouillée"); };
$("#save-state").addEventListener("click", () => { if (fileHandle && filePerm !== "granted") reconnectFile(); else openDrawer("__bg"); });
$("#btn-full").onclick = () => {
  const d = document; try {
    if (d.fullscreenElement) d.exitFullscreen(); else (d.documentElement.requestFullscreen ? d.documentElement.requestFullscreen() : Promise.reject()).catch(() => toast("Plein écran indisponible ici"));
  } catch { toast("Plein écran indisponible ici"); }
};
// Keep the screen awake while the board is shown (optional)
document.addEventListener("pointerdown", function wl() { document.removeEventListener("pointerdown", wl); try { navigator.wakeLock && navigator.wakeLock.request("screen").catch(() => {}); } catch {} }, { once: true });

/* ================= Loop & boot ================= */
function loop() { mounted.forEach(m => { if (m.tick) m.tick(); }); requestAnimationFrame(loop); }
renderAll(); loop(); resetHistory();
connectCloud();
})();
</script>
